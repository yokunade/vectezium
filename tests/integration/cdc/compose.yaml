# Servers for the CDC integration tests (the `postgres_cdc-integration-tests` and
# `mysql_cdc-integration-tests` features):
#
#   docker compose -f tests/integration/cdc/compose.yaml up -d --wait
#   cargo test --lib --no-default-features --features postgres_cdc-integration-tests -- \
#     sources::postgres_cdc::integration_tests
#   cargo test --lib --no-default-features --features mysql_cdc-integration-tests -- \
#     sources::mysql_cdc::integration_tests
#
# PG_VERSION and MYSQL_VERSION pick the images (default 17 and 8.4); PG_PORT, MYSQL_PORT and
# AZURITE_PORT the host ports. The tests read PG_CDC_HOST, PG_CDC_PORT, MYSQL_CDC_HOST,
# MYSQL_CDC_PORT and AZURITE_ADDRESS (default: localhost, 5432, localhost, 3306, localhost).
# Every test creates its own database (and slot, or replica server ID), so tests run in parallel
# against one server. Recreate the servers (`down -v`) between local runs.
name: vectezium-cdc-it

services:
  postgres:
    image: postgres:${PG_VERSION:-17}
    environment:
      POSTGRES_PASSWORD: postgres
    # A short wal_sender_timeout makes the tests for silent connections and stalled sinks fast;
    # the tests report their position every second.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=100
      - -c
      - max_wal_senders=100
      - -c
      - max_connections=400
      - -c
      - wal_sender_timeout=5s
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 60

  # Configured like a production CDC source: ROW events, FULL images and metadata, GTIDs.
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    environment:
      MYSQL_ROOT_PASSWORD: root
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --binlog-rows-query-log-events=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --max-connections=500
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      retries: 60

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
    ports:
      - "127.0.0.1:${AZURITE_PORT:-10000}:10000"
