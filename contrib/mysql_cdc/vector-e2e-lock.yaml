# A second instance of the `mysql` source in vector-e2e.yaml, with the same server_id, offsets
# directory and lock: run-e2e.sh checks it waits for the lock and then resumes from the offset.
data_dir: ./out/data

acknowledgements:
  enabled: true

sources:
  mysql:
    type: mysql_cdc
    hostname: 127.0.0.1
    port: 3306
    user: vector_cdc
    password: cdcpw
    server_id: 5401
    topic_prefix: e2e
    database_include_list: ["inventory"]
    table_exclude_list: ["inventory\\.audit_log"]
    column_exclude_list: ["inventory\\.customers\\.ssn"]
    decimal_handling_mode: string
    ssl_mode: disabled
    heartbeat_interval_secs: 5
    single_writer_lock:
      connection_string: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
      container_name: cdc
      blob_name: e2e/_lock
      lease_duration_secs: 15

sinks:
  raw:
    type: file
    inputs: ["mysql"]
    path: ./out/raw-b.ndjson
    encoding:
      codec: json
