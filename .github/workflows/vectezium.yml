# Vectezium: checks formatting and the licence list, then builds the CDC features and runs their
# unit tests. Vector's own workflows assume Datadog's secrets and runners; they are disabled in
# this fork's Actions settings.
name: Vectezium

on:
  push:
    branches: [vectezium]
  pull_request:
    branches: [vectezium]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FEATURES: sources-mysql_cdc,sources-postgres_cdc,sinks-azure_blob
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake libclang-dev protobuf-compiler
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: LICENSE-3rdparty.csv has four columns on every row
        run: >
          python3 -c "import csv, sys;
          bad = [n for n, row in enumerate(csv.reader(open('LICENSE-3rdparty.csv')), 1) if len(row) != 4];
          sys.exit(f'rows with the wrong number of columns (quote fields that contain commas): {bad}' if bad else 0)"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Clippy
        run: cargo clippy --locked --lib --tests --no-default-features --features "$FEATURES" -- -D warnings
      - name: Unit tests
        run: >
          cargo test --locked --lib --no-default-features --features "$FEATURES" --
          sources::cdc sources::mysql_cdc sources::postgres_cdc sinks::azure_blob
