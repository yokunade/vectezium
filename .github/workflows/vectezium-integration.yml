# Vectezium integration tests: the CDC sources against real servers
# (tests/integration/cdc/compose.yaml), on each PostgreSQL version the source supports. Runs on
# every push to the vectezium branch, and on pull requests that touch the CDC code.
name: Vectezium integration

on:
  push:
    branches: [vectezium]
  pull_request:
    branches: [vectezium]
    paths:
      - "src/sources/cdc/**"
      - "src/sources/mysql_cdc/**"
      - "src/sources/postgres_cdc/**"
      - "src/internal_events/*cdc*.rs"
      - "src/sinks/azure_blob/**"
      - "src/sinks/azure_common/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tests/integration/cdc/**"
      - ".github/workflows/vectezium-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version, the demo's, and the first that publishes generated columns.
        postgres: ["13", "17", "18"]
    env:
      PG_VERSION: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake libclang-dev protobuf-compiler
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: cdc-integration
          save-if: ${{ matrix.postgres == '17' }}
      - name: Start PostgreSQL and Azurite
        run: docker compose -f tests/integration/cdc/compose.yaml up -d --wait
      - name: Clippy
        if: matrix.postgres == '17'
        run: cargo clippy --locked --lib --tests --no-default-features --features postgres_cdc-integration-tests -- -D warnings
      - name: Integration tests
        run: >
          cargo test --locked --lib --no-default-features --features postgres_cdc-integration-tests --
          sources::postgres_cdc::integration_tests
      - name: Server logs
        if: failure()
        run: docker compose -f tests/integration/cdc/compose.yaml logs --tail 200
